## Here's an example of a textholder ##
example:
  text: "&nhere"
  click-event: true
  click-type: "suggest_command"
  click-line: "/me Example"
  hover-event: true
  hover-type: "show_text"
  hover-line: "<&b:&9>Click me"
  use-in-chat: true

dialog_example:
  text: "&bClick here for dialog"
  click-event: true
  click-type: "show_dialog"
  click-line: "example_dialog"
  use-in-chat: true
